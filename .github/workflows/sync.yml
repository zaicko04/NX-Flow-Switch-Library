name: Actualizar biblioteca NX Flow
on:
  schedule:
    - cron: "12 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync.yml"
      - "scripts/sync_catalog.py"
      - "scripts/resolve_covers.py"
      - "scripts/dedupe_catalog.py"
      - "scripts/build_port_guides.py"
      - "data/port_overrides.json"
      - "data/covers.json"
      - "data/custom/**"
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importar SwitchPorts, Homebrew App Store y GBAtemp
        run: python scripts/sync_catalog.py
      - name: Agregar carátulas verificadas por consola
        run: python scripts/resolve_covers.py
      - name: Ocultar duplicados y elegir la versión más reciente
        run: python scripts/dedupe_catalog.py
      - name: Construir fichas de instalación desde los README de cada port
        run: python scripts/build_port_guides.py
      - name: Guardar catálogo actualizado
        run: |
          git add data/catalog.json data/port_guides.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: actualizar catálogo y guías de instalación"
            git push
          else
            echo "No hay cambios"
          fi
