[build]
  publish = "."
  command = "echo 'NX Flow: static site ready'"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=900, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
